<title>Galerici Simülatörü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-screen first-person 3D world; HUD corners (status top-left, minimap top-right, objective under status), crosshair + prompt centre, car sheet right, phone/dialog overlays. Single game look. */
:root{
  --ink:#16191e; --paper:#f6f4ef; --glass:rgba(18,21,27,.78); --line:rgba(255,255,255,.14);
  --fg:#f3f1ec; --muted:#a4a9b3; --blue:#2b5fd6; --blue-tr:#1f4fbf; --money:#58d68d; --bad:#ff7a66; --warn:#f2b441;
  --e-org:#cfd3da; --e-lok:#f3c27a; --e-boy:#ee9b2f; --e-deg:#d6402b; --e-ezk:#9a6bd1;
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:#0e1014;color:var(--fg);font-family:var(--body);font-size:14px;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

.hud{position:fixed;pointer-events:none;z-index:2}
.tl{top:max(12px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;max-width:min(360px,calc(100% - 220px))}
.status{display:flex;gap:6px;flex-wrap:wrap;align-items:stretch}
.plate{display:inline-flex;align-items:stretch;border:2px solid #111;border-radius:5px;background:#fff;color:#111;overflow:hidden;font-family:var(--display);font-weight:700;line-height:1;flex:none}
.plate .tr{background:var(--blue-tr);color:#fff;font-size:10px;padding:3px 4px;display:flex;align-items:flex-end}
.plate b{padding:4px 8px 3px;letter-spacing:.06em;font-size:17px;white-space:nowrap}
.box{background:var(--glass);border:1px solid var(--line);border-radius:7px;backdrop-filter:blur(6px)}
.st{padding:4px 10px;display:flex;flex-direction:column;justify-content:center}
.st small{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.st b{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.st.cash b{color:var(--money)}
.obj{padding:9px 12px;display:flex;flex-direction:column;gap:3px}
.obj small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--warn);font-weight:600}
.obj p{margin:0;font-size:14px;line-height:1.35}
.obj p em{font-style:normal;font-family:var(--mono);color:var(--muted);font-size:12.5px}
.tr-mini{top:max(12px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
#mini{width:168px;height:168px;border-radius:8px;border:1px solid var(--line);display:block;background:#2c3329}
#cross{left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.5)}
#cross.on{background:var(--warn);width:10px;height:10px;margin:-5px 0 0 -5px}
#prompt{left:50%;top:calc(50% + 22px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:5px;max-width:calc(100% - 32px)}
.pr{background:var(--glass);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:13.5px;white-space:nowrap;display:flex;gap:8px;align-items:center}
.pr kbd{font-family:var(--mono);font-size:11.5px;font-weight:700;background:var(--fg);color:var(--ink);border-radius:4px;padding:1px 6px}
.pr.title{font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:.02em}
#ring{left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px}
#ring circle{fill:none;stroke-width:4}
#speedo{left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:6px 16px;text-align:center}
#speedo b{font-family:var(--display);font-size:38px;font-weight:800;line-height:1;display:block}
#speedo small{font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.spd-row{display:flex;align-items:baseline;justify-content:center;gap:10px}
.gear{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--warn);border:1px solid var(--line);border-radius:5px;padding:0 6px}
.rpm{display:block;width:150px;height:5px;background:#3a3f48;border-radius:3px;overflow:hidden;margin-top:5px}
.rpm i{display:block;height:100%;width:0;background:var(--warn)}
.rpm.fuel{height:4px;margin-top:4px}
.mbar{display:inline-block;width:90px;height:6px;border-radius:3px;background:#e4e1da;overflow:hidden;vertical-align:middle;margin-right:6px}
.mbar i{display:block;height:100%;background:var(--blue)}
.lc.goal.ok{border-color:#1d8049;background:#f1faf4}
#sheet{right:max(16px,env(safe-area-inset-right,0px));top:196px;width:270px;padding:12px;display:flex;flex-direction:column;gap:9px;max-height:calc(100% - 300px);overflow:hidden}
#sheet h3{margin:0;font-family:var(--display);font-size:24px;font-weight:800;line-height:1}
#sheet .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-family:var(--mono);font-size:12px}
.chk{display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.chk span{display:flex;justify-content:space-between;gap:8px}
.chk i{font-style:normal;color:var(--muted)}
.chk .ok{color:var(--money)} .chk .bad{color:var(--bad)} .chk .warn{color:var(--warn)}
.eksrow{display:grid;grid-template-columns:88px 1fr;gap:10px;align-items:center}
.eksrow svg{width:88px;height:auto}
.est{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:8px}
.est b{font-family:var(--mono);font-size:16px;color:var(--money)}
.est small{color:var(--muted);font-size:11.5px}
#toast{left:50%;top:max(14px,env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;width:max-content;max-width:calc(100% - 420px)}
.t{background:var(--glass);border:1px solid var(--line);border-left:3px solid var(--warn);padding:7px 12px;border-radius:6px;font-size:13.5px;animation:tin .2s ease-out}
.t.good{border-left-color:var(--money)} .t.bad{border-left-color:var(--bad)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}

/* overlays */
.ov{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:16px;background:rgba(8,10,14,.5)}
.phone{width:380px;max-width:100%;height:min(680px,100%);background:#f6f4ef;color:var(--ink);border-radius:26px;border:8px solid #111;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.5)}
.ph-top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 6px;font-family:var(--mono);font-size:12px;color:#555}
.ph-tabs{display:flex;gap:4px;padding:0 10px}
.ph-tabs{overflow-x:auto}
.ph-tabs button{flex:none;border:0;background:none;padding:9px 7px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:#888;border-bottom:3px solid transparent}
.ph-tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--blue)}
.ph-body{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.lc{background:#fff;border:1px solid #ddd8cf;border-radius:10px;padding:11px;display:flex;flex-direction:column;gap:6px}
.lc .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lc h4{margin:0;font-family:var(--display);font-size:21px;font-weight:700;line-height:1}
.lc .p{font-family:var(--mono);font-weight:700;font-size:15px;white-space:nowrap}
.lc .m{color:#666;font-size:12.5px}
.lc q{font-style:italic;font-size:13px;color:#333;line-height:1.4}
.lc .acts{display:flex;gap:6px;flex-wrap:wrap}
.b{border:1px solid #d3cec4;background:#fff;border-radius:7px;padding:8px 11px;font-weight:600;font-size:13px;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.b em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--blue)}
.b.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.b.pri em{color:#d6e2ff}
.b.go{background:#1d8049;border-color:#1d8049;color:#fff}
.b.go em{color:#d6f3e1}
.b:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:#eceae5;color:#4a4f58}
.pill.g{background:#dff2e6;color:#1d8049} .pill.r{background:#f8e0db;color:#b33a26} .pill.y{background:#f9ead2;color:#8a5506} .pill.bl{background:#e3e9f8;color:var(--blue)}
.inrow{display:flex;gap:6px}
.inrow input{flex:1;min-width:0;border:1px solid #d3cec4;border-radius:7px;padding:8px 10px;font-family:var(--mono);font-size:14px;color:var(--ink);background:#fff}
.note{font-size:12.5px;color:#666;line-height:1.45;margin:0}
.ph-close{border:0;background:#111;color:#fff;padding:12px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase}

.dlg{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:520px;max-width:calc(100% - 32px);max-height:calc(100% - 120px);z-index:5;background:var(--paper);color:var(--ink);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 60px rgba(0,0,0,.5);overflow:auto}
.dlg .who{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.dlg .who b{font-family:var(--display);font-size:24px;font-weight:800;line-height:1}
.dlg .who span{font-family:var(--mono);font-size:14px;font-weight:700}
.chat{display:flex;flex-direction:column;gap:6px;max-height:200px;overflow:auto}
.msg{max-width:85%;padding:7px 11px;border-radius:12px;font-size:13.5px;line-height:1.35}
.msg.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:3px}
.msg.them{align-self:flex-start;background:#fff;border:1px solid #ddd8cf;border-bottom-left-radius:3px}
.msg.sys{align-self:center;color:#777;font-size:12px;padding:0}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:1px solid #d3cec4;background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-family:var(--mono)}
.rep{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;background:#fff;border:1px solid #ddd8cf;border-radius:8px;padding:8px 10px;font-size:13px}
.rep small{display:block;color:#777;font-size:12px}

.modal{position:fixed;inset:0;z-index:8;background:rgba(8,10,14,.72);display:grid;place-items:center;padding:16px}
.mc{background:var(--paper);color:var(--ink);border-radius:12px;width:480px;max-width:100%;max-height:100%;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:12px}
.mc h2{margin:0;font-family:var(--display);font-weight:800;font-size:36px;line-height:1;text-wrap:balance}
.mc p{margin:0;line-height:1.5}
.mc ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;line-height:1.45;font-size:13.5px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.keys kbd{font-family:var(--mono);font-size:11.5px;font-weight:700;background:var(--ink);color:#fff;border-radius:4px;padding:1px 6px;justify-self:start}
.ledger{width:100%;border-collapse:collapse}
.ledger td{padding:6px 0;border-bottom:1px solid #ddd8cf}
.ledger td:last-child{text-align:right;font-family:var(--mono)}
.pos{color:#1d8049} .neg{color:#b33a26}

/* touch controls */
.touch{position:fixed;z-index:3;display:none}
body.is-touch .touch{display:block}
#joy{left:max(20px,env(safe-area-inset-left,0px));bottom:max(24px,env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.35)}
.tbtns{right:max(16px,env(safe-area-inset-right,0px));bottom:max(24px,env(safe-area-inset-bottom,0px));display:flex !important;flex-direction:column;gap:10px;align-items:flex-end}
body:not(.is-touch) .tbtns{display:none !important}
.tbtns button{width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(18,21,27,.7);font-family:var(--display);font-weight:700;font-size:15px;touch-action:none}
.tbtns button.big{width:78px;height:78px;background:rgba(242,180,65,.85);color:#111;border-color:transparent;font-size:17px}
.tbtns .rowb{display:flex;gap:10px}
body.is-touch #speedo{bottom:auto;top:max(12px,env(safe-area-inset-top,0px))}
body.is-touch #sheet{display:none}

#mini{pointer-events:auto;cursor:pointer}
#mapOv{background:rgba(8,10,14,.82)}
.mapwrap{display:flex;flex-direction:column;gap:10px;align-items:center;max-width:100%}
#bigMap{width:min(92vw,80vh);height:min(92vw,80vh);border-radius:12px;border:2px solid #111;display:block;cursor:crosshair;background:#56653f;touch-action:none}
.maphead{display:flex;justify-content:space-between;align-items:center;width:min(92vw,80vh);gap:10px}
.maphead b{font-family:var(--display);font-size:24px;font-weight:800}
.maplegend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:12.5px;color:#e8e6e0;width:min(92vw,80vh)}
.maplegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.mapclose{background:var(--fg);color:var(--ink);border:0;border-radius:6px;padding:7px 14px;font-weight:600}
.hand{padding:7px 12px;display:flex;flex-direction:column;gap:2px}
.hand small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--money);font-weight:600}
.hand p{margin:0;font-size:14px}
.hand p em{font-style:normal;color:var(--muted);font-size:12px}
.lvl{display:flex;align-items:center;gap:8px;padding:4px 10px}
.lvl .badge{width:30px;height:30px;border-radius:50%;background:var(--warn);color:#16191e;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px}
.lvl .xpw{display:flex;flex-direction:column;gap:3px;min-width:70px}
.lvl .xpw small{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lvl .xpbar{height:5px;border-radius:3px;background:#3a3f48;overflow:hidden}
.lvl .xpbar i{display:block;height:100%;width:0;background:var(--warn)}
.lvl .sp{font-size:11px;font-weight:600;color:#16191e;background:var(--money);border-radius:999px;padding:1px 7px}
.sndb{pointer-events:auto;border:1px solid var(--line);background:var(--glass);border-radius:7px;padding:0 10px;font-size:12px;color:var(--muted)}
#xpFloat{left:50%;top:calc(50% - 70px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px}
.xpf{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--warn);text-shadow:0 1px 3px rgba(0,0,0,.8);animation:xpup 1.8s ease-out forwards;white-space:nowrap}
@keyframes xpup{0%{opacity:0;transform:translateY(8px)}15%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
#lvlBanner{left:50%;top:22%;transform:translateX(-50%);background:var(--glass);border:1px solid var(--warn);border-radius:12px;padding:14px 26px;text-align:center;display:flex;flex-direction:column;gap:2px}
#lvlBanner small{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--warn)}
#lvlBanner b{font-family:var(--display);font-size:40px;font-weight:800;line-height:1}
#lvlBanner span{font-size:13px;color:var(--muted)}
#lvlBanner.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}
.hotbar{left:50%;bottom:max(14px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:5px;pointer-events:auto}
.slot{position:relative;width:66px;height:60px;border-radius:8px;border:1px solid var(--line);background:var(--glass);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}
.slot svg{width:22px;height:22px;fill:none;stroke:var(--fg);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.slot span{font-size:10.5px;line-height:1.1;text-align:center}
.slot kbd{position:absolute;left:4px;top:3px;font-family:var(--mono);font-size:9.5px;color:var(--muted)}
.slot.on{border-color:var(--warn);background:rgba(242,180,65,.2)}
.slot.off{opacity:.35}
.buildbar .slot{width:auto;min-width:78px;padding:6px 8px}
.buildbar .slot em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--warn)}
.bb-hint{font-size:11px;color:var(--muted);align-self:center;padding:0 6px;line-height:1.4;background:var(--glass);border-radius:6px;padding:6px 8px}
body.is-touch .hotbar{bottom:auto;top:calc(max(12px,env(safe-area-inset-top,0px)) + 190px);left:auto;right:max(16px,env(safe-area-inset-right,0px));transform:none;flex-direction:column}
body.is-touch .slot{width:52px;height:46px}
body.is-touch .slot span{display:none}
#obdOv .tab{width:520px;max-width:100%;background:#0f1612;border:10px solid #22262e;border-radius:18px;color:#c9f5d9;padding:16px;display:flex;flex-direction:column;gap:12px;font-family:var(--mono);box-shadow:0 30px 70px rgba(0,0,0,.5)}
.svc{width:min(860px,100%);max-height:calc(100vh - 32px);overflow:auto;background:#12151a;border:8px solid #22262e;border-radius:16px;color:#e8ebf0;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 30px 70px rgba(0,0,0,.5)}
.svc-top{color:#f2b441}.svc-top button{background:#f2b441}
.svc-h{display:flex;justify-content:space-between;align-items:baseline}.svc-h b{font-family:var(--display);font-size:24px}.svc-h span{font-family:var(--mono);color:#9aa1ad}
.svc-main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px}
@media (max-width:700px){.svc-main{grid-template-columns:1fr}}
.bay{position:relative;aspect-ratio:1/1;max-height:62vh;border-radius:10px;overflow:visible}
.bay svg{width:100%;height:100%;display:block;border-radius:10px}
.hs{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:5px;background:none;border:0;padding:4px;cursor:pointer;color:#fff;font:600 12px var(--body)}
.hs i{width:14px;height:14px;border-radius:50%;background:#9aa1ad;box-shadow:0 0 0 3px rgba(0,0,0,.5);flex:none}
.hs.ok i{background:#58d68d}.hs.mid i{background:#f2b441}.hs.bad i{background:#ff6b57;animation:hsP 1s infinite}.hs.busy i{background:#5aa9ff}
@keyframes hsP{50%{box-shadow:0 0 0 7px rgba(255,107,87,.25)}}
.hs span{background:rgba(10,12,16,.82);border-radius:5px;padding:2px 6px;white-space:nowrap}.hs em{font-style:normal;font-family:var(--mono);color:#f2b441}
.hs.on span{outline:2px solid #f2b441}
.svc-p{display:flex;flex-direction:column;gap:8px;min-width:0}.svc-p h4{margin:0;font-family:var(--display);font-size:22px}
.svc-p .note{color:#9aa1ad}
.svc-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:#9aa1ad}.svc-meta b{font-family:var(--mono);color:#fff}.svc-meta b.ok{color:#58d68d}.svc-meta b.mid{color:#f2b441}.svc-meta b.bad{color:#ff6b57}
.svc-acts{display:flex;gap:6px;flex-wrap:wrap}
.svc-sym{background:#2a1612;border-radius:8px;padding:8px 10px}.svc-sym small{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#ff9c88}.svc-sym p{margin:4px 0 0;font-size:13.5px;color:#ffd0c8}
.bolts{display:flex;flex-wrap:wrap;gap:10px;padding:6px 0}

/* ===== UI refresh: plate white, asphalt, TR blue, satılık red ===== */
:root{
  --asf:#24272c; --asf2:#2f333a; --asf3:#3b4049; --plate:#f7f6f1; --plate2:#ecebe4; --tr:#1f4fbf; --red:#d3261f; --sar:#f2b441; --yes:#2fa864;
  --glass:rgba(30,33,38,.86); --line:rgba(255,255,255,.12);
  --mono:'Barlow Semi Condensed','Barlow Condensed','Arial Narrow',sans-serif;
}
body{font-variant-numeric:tabular-nums}
/* HUD */
.box{background:var(--glass);border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.st small,.obj small{text-transform:none;letter-spacing:.02em;font-size:11px;font-weight:600}
.st b{font-weight:700;font-size:17px}
.st.cash{padding-inline:12px}.st.cash b{font-size:20px}
.obj{border-left:4px solid var(--sar);border-radius:6px 10px 10px 6px}
.obj small{color:var(--sar);font-size:12px}
.plate{border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2),0 3px 10px rgba(0,0,0,.3)}
.pr{background:rgba(30,33,38,.9);border-radius:999px;padding:6px 14px}
.pr kbd{border-radius:5px;font-family:var(--display);font-size:13px}
.t{background:rgba(30,33,38,.94);border:0;border-radius:999px;padding:8px 16px 8px 14px;box-shadow:0 6px 18px rgba(0,0,0,.35);display:flex;gap:9px;align-items:center;border-left:0}
.t::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--sar);flex:none}
.t.good::before{background:#58d68d}.t.bad::before{background:#ff6b57}
/* dialog */
.dlg{background:var(--plate);border-radius:18px;padding:0 0 14px;gap:10px;box-shadow:0 24px 70px rgba(0,0,0,.55);animation:dlgIn .18s ease-out}
.dlg>*{margin-inline:16px}
.dlg .who{margin:0;padding:14px 16px 12px;background:var(--asf);color:#fff;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;position:sticky;top:0;z-index:1}
.dlg .who .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px;color:#fff;background:var(--tr);box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.dlg .who b{font-size:24px}
.dlg .who span{font-family:var(--body);font-weight:600;font-size:13px;color:#c9ced8;text-align:right}
.chat{padding:4px 2px}
.msg{border-radius:16px;font-size:14px;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.msg.them{background:#fff;border:0}
.msg.me{background:var(--tr)}
.b{border-radius:10px;border-color:#d7d4cb;font-weight:600;padding:9px 13px}
.b.pri{background:var(--tr);border-color:var(--tr)}
.b.go{background:var(--yes);border-color:var(--yes)}
.rep{border:0;border-radius:12px;box-shadow:0 1px 0 rgba(0,0,0,.05)}

.menu-sub{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:18px}

.menu-logo h1{display:none}
.mbtn{text-transform:none;font-size:30px;letter-spacing:.005em;padding:7px 16px;border-left:0;border-radius:10px;color:#e9e7e1;align-items:center}

.lob-code{font-family:var(--display);font-weight:800;font-size:44px;letter-spacing:.12em;line-height:1;color:#111}
.lob-link{display:flex;gap:6px}.lob-link input{flex:1;border-color:#d7d4cb;font-size:13px}

.lob-pl li small{color:#555;font-weight:500}
.lob-pl li.wait{background:transparent;color:#555;font-weight:500;font-size:13.5px}.lob-pl li.wait i{display:none}
.lob-acts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}

  const l2 = new THREE.Mesh(lg, pants); l2.position.y = -0.425; legR.add(l2);
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.27, 0.72, 12), mat(shirt)); torso.position.y = 1.22;
  const aG = new THREE.BoxGeometry(0.13, 0.66, 0.15);

}

function remoteOffer(car, x) {
  if (!car || car.closed || car.deal) return;
  if (!x || x < 1000) return toast('Geçerli bir teklif yaz', 'bad');
  const minE = r500(car.min * (1 - 0.03 * skill('neg_charm')));
  x = r500(x); car.chat.push({ w: 'me', t: `Merhaba, ${fmt(x)} olur mu?` });
  if (x >= minE) { car.deal = true; car.ask = Math.min(x, car.ask); car.min = Math.min(car.min, car.ask); car.chat.push({ w: 'them', t: `Tamam, ${fmt(car.ask)}. Gel arabayı al, bekliyorum.` }); toast('Satıcı kabul etti! Gidip arabayı al.', 'good'); return; }
  const ratio = x / minE; car.patience -= ratio < 0.8 ? 2 : 1;
  if (car.patience <= 0) { car.chat.push({ w: 'them', t: 'Bu fiyata mesaj atma kardeşim.' }); car.closed = true; return; }
  car.ask = Math.max(minE, r500(car.ask - (car.ask - Math.max(x, minE)) * rnd(0.2, 0.35)));
  car.chat.push({ w: 'them', t: `Olmaz. En son ${fmt(car.ask)}, gelip görürsen konuşuruz.` });
}

    else if (mode === 'drive') focusCar = S.driving;
    else if (focusCar) { const c = carById(focusCar); if (!c || Math.hypot(c.x - player.x, c.z - player.z) > 6) focusCar = null; }
